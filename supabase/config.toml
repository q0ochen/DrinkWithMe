# Drink With Me – Supabase-Konfiguration für die lokale Entwicklung und CI (Supabase CLI).
# Referenz: https://supabase.com/docs/guides/local-development/cli/config
# Vertrag: docs/ARCHITEKTUR.md, Abschnitt 2. Einrichtung des echten Projekts: supabase/README.md.
#
# Geheimnisse stehen NIE in dieser Datei, sondern werden über env(...) aus Umgebungsvariablen oder
# supabase/.env gelesen (die .env-Datei ist per .gitignore ausgeschlossen).

project_id = "drink-with-me"

[api]
enabled = true
port = 54321
# Nur das Schema public wird über die Data API ausgeliefert. Interne Funktionen liegen im Schema private.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Muss zur Version des echten Projekts passen (Supabase Free: Postgres 17).
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Keine Beispieldaten: Testnutzer legen die pgTAP-Tests selbst an (supabase/tests).
enabled = false
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
# Nicht benötigt: Apps fragen neue Ereignisse ab bzw. bekommen Push-Nachrichten.
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
# Keine E-Mail-Anmeldung, daher kein lokaler Test-Mailserver.
enabled = false
port = 54324

[storage]
# Profilbilder kommen von Google; eigener Dateispeicher wird nicht verwendet.
enabled = false
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
# Platzhalter für die lokale Web-App (Vite). Im echten Projekt: <WEB_APP_URL> im Dashboard unter
# Authentication → URL Configuration eintragen (siehe supabase/README.md).
site_url = "http://127.0.0.1:5173"
# Erlaubte Rückleitungen nach der Google-Anmeldung: Android-App (PKCE im Browser) und Web-App.
# Der zweite Eintrag ist der lokale Platzhalter für <WEB_APP_URL>/auth/callback.
additional_redirect_urls = ["drinkwithme://auth-callback", "http://127.0.0.1:5173/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Neue Konten entstehen ausschließlich über Google (siehe unten). Muss true bleiben, sonst kann sich
# niemand zum ersten Mal anmelden.
enable_signup = true
# Anonyme Anmeldung AUS (wichtig für den E-Mail-Abgleich bei Freundschaftsanfragen).
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = ""

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
# E-Mail/Passwort AUS: keine Registrierung per E-Mail.
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
max_frequency = "5s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

# Einziger aktiver Anmeldeanbieter: Google (OAuth-Client vom Typ „Webanwendung“, Scopes openid email profile).
# Werte kommen aus Umgebungsvariablen bzw. supabase/.env – nie einchecken.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[auth.web3.solana]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# Beide Funktionen prüfen das Nutzer-JWT selbst über /auth/v1/user (funktioniert mit alten und neuen
# JWT-Signaturschlüsseln). Die Gateway-Prüfung ist deshalb aus; ohne gültige Sitzung antworten sie 401.
[functions.notify-friends]
enabled = true
verify_jwt = false

[functions.delete-account]
enabled = true
verify_jwt = false

[analytics]
enabled = false
port = 54327
backend = "postgres"

# Baut die Android-App bei jedem Push und stellt die APK zum Herunterladen bereit.
# Download: GitHub → Actions → „Android“ → letzter Lauf → Artifacts → DrinkWithMe-android-apk
name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests der Geschäftslogik
        run: ./gradlew :core:test --no-daemon

      - name: Debug-APK bauen
        run: ./gradlew :app:assembleDebug --no-daemon

      # Stellt sicher, dass die APK mit dem festen Schlüssel aus app/debug.keystore signiert ist.
      # Nur dann lassen sich neue Versionen über alte installieren, ohne Daten zu verlieren.
      - name: Signatur prüfen (fester Debug-Schlüssel)
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          EXPECTED="$(keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey \
            | grep 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"
          ACTUAL="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | grep 'SHA-256 digest' | head -1 | awk '{print $NF}')"
          echo "Erwartet:    $EXPECTED"
          echo "Tatsächlich: $ACTUAL"
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"

      - uses: actions/upload-artifact@v4
        with:
          name: DrinkWithMe-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

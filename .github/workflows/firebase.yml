# Prüft das Firebase-Backend (Sicherheitsregeln + Cloud Functions) bei jedem Push:
# Build, Lint/Typprüfung, Unit-Tests und Tests gegen die Firebase-Emulatoren (Auth, Firestore, Functions).
# Es wird nichts bereitgestellt – dafür gibt es den manuellen Workflow „Firebase Deploy“.
name: Firebase

on:
  push:
    paths:
      - "firebase/**"
      - ".github/workflows/firebase.yml"
      # Vom Abgleichstest (test/unit/kotlinCore.contract.test.ts) gelesene Kotlin-Dateien:
      - "android/core/src/main/kotlin/com/drinkwithme/core/domain/DrinkCategory.kt"
      - "android/core/src/main/kotlin/com/drinkwithme/core/social/**"
  pull_request:
    paths:
      - "firebase/**"
      - ".github/workflows/firebase.yml"
      - "android/core/src/main/kotlin/com/drinkwithme/core/domain/DrinkCategory.kt"
      - "android/core/src/main/kotlin/com/drinkwithme/core/social/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firebase/functions/package-lock.json
            firebase/package-lock.json

      # firebase-tools 15 startet die Emulatoren nur mit Java 21 oder neuer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Abhängigkeiten installieren (Functions)
        run: npm ci

      - name: Firebase CLI installieren (feste Version aus firebase/package-lock.json)
        working-directory: firebase
        run: npm ci

      - name: Functions bauen (TypeScript)
        run: npm run build

      - name: Lint und Typprüfung
        run: |
          npm run lint
          npm run typecheck

      - name: Unit-Tests (ohne Emulatoren)
        run: npm test

      - name: Emulatoren zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}

      - name: Emulator-Tests (Sicherheitsregeln, Callables, Trigger)
        working-directory: firebase
        run: npx firebase emulators:exec --project demo-drinkwithme --only auth,firestore,functions "npm --prefix functions run test:emulator"

      - name: Emulator-Protokolle hochladen (nur bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-emulator-logs
          path: firebase/*-debug.log
          if-no-files-found: ignore

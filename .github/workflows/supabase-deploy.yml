# Stellt Datenbank-Migrationen und Edge Functions im echten Supabase-Projekt bereit – nur manuell:
# GitHub → Actions → „Supabase Deploy“ → „Run workflow“.
#
# Voraussetzungen (Schritt für Schritt in supabase/README.md):
#   Secret   SUPABASE_ACCESS_TOKEN – persönliches Zugriffstoken (Supabase-Dashboard → Account → Access Tokens)
#   Secret   SUPABASE_DB_PASSWORD  – Datenbank-Passwort des Projekts (beim Anlegen des Projekts vergeben)
#   Variable SUPABASE_PROJECT_REF  – Projekt-Referenz, z. B. abcdefghijklmnopqrst (aus https://<ref>.supabase.co)
# Die VAPID-Secrets der Edge Functions setzt der Projektinhaber einmalig selbst (siehe supabase/README.md).
name: Supabase Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

# Nie zwei Deployments gleichzeitig.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Einstellungen prüfen
        run: |
          fehler=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Secret SUPABASE_ACCESS_TOKEN fehlt::Bitte unter Settings → Secrets and variables → Actions → Secrets das Secret SUPABASE_ACCESS_TOKEN anlegen (Supabase-Dashboard → Account → Access Tokens → Generate new token). Anleitung: supabase/README.md"
            fehler=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error title=Secret SUPABASE_DB_PASSWORD fehlt::Bitte unter Settings → Secrets and variables → Actions → Secrets das Secret SUPABASE_DB_PASSWORD mit dem Datenbank-Passwort des Projekts anlegen (vergessen? Dashboard → Project Settings → Database → Reset database password). Anleitung: supabase/README.md"
            fehler=1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error title=Variable SUPABASE_PROJECT_REF fehlt::Bitte unter Settings → Secrets and variables → Actions → Variables die Variable SUPABASE_PROJECT_REF mit der Projekt-Referenz anlegen (der Teil vor .supabase.co in der Projekt-URL). Anleitung: supabase/README.md"
            fehler=1
          elif ! printf '%s' "$SUPABASE_PROJECT_REF" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error title=SUPABASE_PROJECT_REF ungültig::„$SUPABASE_PROJECT_REF“ ist keine gültige Projekt-Referenz. Gemeint ist die 20-stellige Kennung aus der Projekt-URL https://<referenz>.supabase.co (Dashboard → Project Settings → General → Project ID), nicht der Projektname."
            fehler=1
          fi
          if [ "$fehler" -ne 0 ]; then
            echo "Deployment abgebrochen: Es fehlen Einstellungen (siehe Fehlermeldungen oben)."
          fi
          exit "$fehler"

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Mit dem Projekt verbinden (supabase link)
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ausstehende Migrationen anzeigen (Probelauf)
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Migrationen anwenden (supabase db push)
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Edge Functions bereitstellen
        run: supabase functions deploy notify-friends delete-account --project-ref "$SUPABASE_PROJECT_REF" --use-api

      # Nur ein Hinweis: Die VAPID-Secrets setzt der Projektinhaber selbst; ohne sie antwortet notify-friends
      # mit 500 „server_misconfigured“.
      - name: VAPID-Secrets prüfen
        run: |
          namen="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" 2>/dev/null || true)"
          fehlt=""
          for name in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do
            printf '%s' "$namen" | grep -q "$name" || fehlt="$fehlt $name"
          done
          if [ -n "$fehlt" ]; then
            echo "::warning title=VAPID-Secrets fehlen::Nicht gesetzt:$fehlt. Ohne sie verschickt notify-friends keine Benachrichtigungen. Einmalig setzen: deno run supabase/scripts/vapid-schluessel-erzeugen.ts und dann supabase secrets set … (Anleitung: supabase/README.md)."
          else
            echo "VAPID-Secrets sind gesetzt."
          fi

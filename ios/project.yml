# XcodeGen-Spezifikation: `xcodegen generate` erzeugt DrinkWithMe.xcodeproj
name: DrinkWithMe
options:
  bundleIdPrefix: com.drinkwithme
  deploymentTarget:
    iOS: "16.0"
packages:
  DrinkWithMeCore:
    path: DrinkWithMeCore
targets:
  DrinkWithMe:
    type: application
    platform: iOS
    sources: [DrinkWithMe]
    dependencies:
      - package: DrinkWithMeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drinkwithme.app
        PRODUCT_NAME: DrinkWithMe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Drink With Me"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  DrinkWithMe:
    build:
      targets:
        DrinkWithMe: all
    test:
      targets:
        - package: DrinkWithMeCore/DrinkWithMeCoreTests
